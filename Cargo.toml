[workspace]
resolver = "3"
members = [
  "examples/wasmcloud-http-hello",
  "examples/wasmcloud-nats-echo",
  "otel-wasi",
  "otel-wasi-dylint",
  "otel-wasi-macros",
]
default-members = ["otel-wasi", "otel-wasi-macros"]

[workspace.package]
version = "0.2.2"
edition = "2024"

[workspace.dependencies]
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32" }
opentelemetry-wasi = {
  package = "opentelemetry-wasi",
  git = "https://github.com/gabber235/opentelemetry-wasi",
  rev = "43d98a3338fd725b4079659b217a038910822c42"
}
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"

wit-bindgen = { version = "0.58", features = ["async-spawn"] }

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

clippy_utils = {
  git = "https://github.com/rust-lang/rust-clippy",
  rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9"
}

[workspace.metadata.dylint]
libraries = [{ path = "otel-wasi-dylint" }]

[profile.release]
opt-level = "s"
strip = true
lto = true
