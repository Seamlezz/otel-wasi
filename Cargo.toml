[workspace]
resolver = "3"
members = [
  "examples/wasmcloud-http-hello",
  "examples/wasmcloud-nats-echo",
  "otel-wasi",
  "otel-wasi-dylint",
  "otel-wasi-macros",
]
default-members = ["otel-wasi", "otel-wasi-macros"]

[workspace.package]
version = "0.2.2"
edition = "2024"

[workspace.dependencies]
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32" }
opentelemetry-wasi = {
  package = "opentelemetry-wasi",
  git = "https://github.com/gabber235/opentelemetry-wasi",
  rev = "835cf49fe351908edc86917a04e52d619385445d"
}
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"

wit-bindgen = { version = "0.63", features = ["async-spawn"] }

proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

clippy_utils = {
  git = "https://github.com/rust-lang/rust-clippy",
  rev = "d81818092783258083cd7be22e3a92a4f432a545"
}

[workspace.metadata.dylint]
libraries = [{ path = "otel-wasi-dylint" }]

[profile.release]
opt-level = "s"
strip = true
lto = true
